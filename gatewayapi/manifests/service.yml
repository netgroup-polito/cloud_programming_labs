apiVersion: v1
kind: Service
metadata:
  name: timeapi
  labels:
    app: timeapi
spec:
  selector:
    app: timeapi
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: timeapi-lb
  labels:
    app: timeapi
spec:
  selector:
    app: timeapi
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8080
